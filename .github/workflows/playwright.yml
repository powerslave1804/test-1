name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 1. DODATO: Dozvole koje omogućavaju GitHub-u da napravi sajt od izveštaja
permissions:
  contents: read
  pages: write
  id-token: write

# Omogućava samo jedan istovremeni deployment na GitHub Pages da se ne bi sudarali
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test --project=chromium

    # Tvoj stari CI korak koji i dalje čuva fajl u arhivi za svaki slučaj
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # 2. DODATO: CD DEO - Priprema (pakovanje) izveštaja za sajt
    - name: Setup Pages
      if: ${{ !cancelled() }}
      uses: actions/configure-pages@v5

    - name: Upload artifact for deployment
      if: ${{ !cancelled() }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'playwright-report/'

    # 3. DODATO: CD DEO - Objavljivanje izveštaja na internet
    - name: Deploy to GitHub Pages
      if: ${{ !cancelled() }}
      uses: actions/deploy-pages@v4
