name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. POSAO: Pokretanje testova i pakovanje rezultata (CI)
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: npx playwright test --project=chromium

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload artifact for deployment
      if: ${{ !cancelled() }}
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'playwright-report/'

  # 2. POSAO: Samostalni deployment koji izbacuje link na ekran (CD)
  deploy:
    needs: test # Ovaj posao čeka da se testovi uspešno završe
    if: ${{ !cancelled() }} # Pokreće se čak i ako testovi padnu, da uvek imaš izveštaj
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
